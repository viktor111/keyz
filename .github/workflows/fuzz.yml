name: Parser fuzzing
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/protocol.rs'
      - 'src/config.rs'
      - 'src/server/backend/format.rs'
      - 'src/server/backend/aof.rs'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz protocol envelopes
        run: cargo +nightly fuzz run protocol -- -max_total_time=30 -max_len=65536
      - name: Fuzz storage formats
        run: cargo +nightly fuzz run storage -- -max_total_time=30 -max_len=65536
      - name: Preserve crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
